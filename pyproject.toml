[project]
name = "premier-league-prediction"
version = "2.0.0"
description = "Predicting English Premier League match results (2000/01-2025/26) with leakage-safe features, Elo ratings and a bookmaker benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
app = [
    "gradio>=4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eplpred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
