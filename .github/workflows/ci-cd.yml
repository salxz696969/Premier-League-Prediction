name: CI and deploy

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.21'
          python-version: '3.13'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run --frozen pytest -q
      - name: Build deployable image
        run: docker build --tag "eplpred:$GITHUB_SHA" .
      - name: Check container readiness and API
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name eplpred-ci --read-only --tmpfs /tmp:rw,size=128m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --publish 127.0.0.1:18000:8000 "eplpred:$GITHUB_SHA"
          trap 'docker logs eplpred-ci; docker rm --force eplpred-ci' EXIT
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 --retry 60 --retry-all-errors --retry-delay 2 --retry-max-time 180 http://127.0.0.1:18000/healthz
          curl --fail --silent --show-error http://127.0.0.1:18000/api/overview | uv run --frozen python -c "import json, sys; data = json.load(sys.stdin); assert data['matches'] == 9880; assert len(data['teams_now']) == 20"
      - name: Deploy tested image to VPS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          APP_PORT: ${{ vars.APP_PORT || '8000' }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || { echo "Missing GitHub Actions secret: $name" >&2; exit 1; }
          done
          [[ "$VPS_SSH_PORT" =~ ^[0-9]+$ ]] && (( VPS_SSH_PORT >= 1 && VPS_SSH_PORT <= 65535 ))
          [[ "$APP_PORT" =~ ^[0-9]+$ ]] && (( APP_PORT >= 1024 && APP_PORT <= 65535 ))
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*[$]?$ ]]
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          ssh_options=(-i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30)
          target="$VPS_USER@$VPS_HOST"
          ssh "${ssh_options[@]}" -p "$VPS_SSH_PORT" "$target" 'mkdir -p /opt/eplpred && docker compose version'
          docker save "eplpred:$GITHUB_SHA" | gzip | ssh "${ssh_options[@]}" -p "$VPS_SSH_PORT" "$target" 'gunzip | docker load'
          scp "${ssh_options[@]}" -P "$VPS_SSH_PORT" deploy/compose.yaml deploy/deploy.sh "$target:/opt/eplpred/"
          ssh "${ssh_options[@]}" -p "$VPS_SSH_PORT" "$target" "bash /opt/eplpred/deploy.sh '$GITHUB_SHA' '$APP_PORT'"
